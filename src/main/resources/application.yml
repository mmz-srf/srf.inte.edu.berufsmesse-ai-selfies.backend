  connectTimeout: 10s
  requestTimeout: 180s

# Change the offset of the person in the image
# reference-width/-height: size (px) of the person image the offsets were tuned with (see the "Received person image of WxH"
# log line). The background is sized from it and the person resized to it, so other camera / AI resolutions give the same result.
# Tuned on the PC with greenscreen-test.jpeg (3024x4032): the AI returns 880x1184 for it, Radio skips the AI.
location-offset:
  values:
    Arena:
      x: 640
      y: 50
      scale: 1.15
      reference-width: 880
      reference-height: 1184
    Meteo:
      x: 710
      y: 180
      scale: 0.95
      reference-width: 880
      reference-height: 1184
    Radio:
      x: 1700
      y: 320
      scale: 0.75
      reference-width: 3024
      reference-height: 4032
    Sport:
      x: 170
      y: 50
      scale: 2.0
      reference-width: 880
      reference-height: 1184
    Tagesschau:
      x: 200
      y: 200
      reference-width: 880
      reference-height: 1184

