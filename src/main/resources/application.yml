spring:
  application:
    name: ai-selfies

settings:
  max-name-length: 20

s3:
  url: "https://www.srf.ch/staticfiles/berufsmesse/ki-pics/"
  bucket: "srf-staticfiles-production"
  user-path: "berufsmesse/ki-pics/"
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}

ai-config:
  url: "http://ec2-63-182-192-6.eu-central-1.compute.amazonaws.com:8080/generate"
  examplePrompt: "Change only the persons clothing to a navy blue suit with long arms (jacket and trousers) with a crisp white dress shirt and a solid dark tie. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The Person should remain upright."
  connectTimeout: 10s
  requestTimeout: 180s
