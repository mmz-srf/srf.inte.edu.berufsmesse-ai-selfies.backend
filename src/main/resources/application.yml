spring:
  application:
    name: ai-selfies

settings:
  max-name-length: 20

s3:
  url: "https://www.srf.ch/staticfiles/berufsmesse/ki-pics/"
  bucket: "srf-staticfiles-production"
  user-path: "berufsmesse/ki-pics/"
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}

ai-config:
  url: "http://ec2-63-182-192-6.eu-central-1.compute.amazonaws.com:8080/generate"
  prompts:
    - prompt: "Change only the persons clothing and accessories to a professional yet modern summer business-casual look. The person should wear a premium, fully buttoned-up long-sleeve linen shirt (sleeves neatly rolled up to the elbows) in a crisp white or light blue, tucked into tailored beige chino trousers, and a pair of sleek, professional sunglasses. The midriff must be completely covered. No hats or other headwear."
      seed: 43
      steps: 5
      gender: "male"
      location: "Meteo"
    - prompt: "Change only the persons clothing and accessories to a professional yet chic summer business-casual outfit. The person should wear a elegant, lightweight blazer over a fully covered minimalist top or a high-quality, fully buttoned shirt tucked into elegant high-waisted trousers. The outfit must completely cover the stomach and midriff. Add a pair of classy, professional sunglasses. No hats or headwear."
      seed: 43
      steps: 5
      gender: "female"
      location: "Meteo"
    - prompt: "Change only the persons clothing to a navy blue suit with long arms (jacket and trousers) with a crisp white dress shirt and a solid dark tie. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The Person should remain upright."
      seed: 43
      steps: 5
      gender: "male"
      location: "Tagesschau"
    - prompt: "Change only the persons clothing to a navy blue suit with long arms (jacket and trousers) with a crisp white dress shirt and a solid dark tie. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The Person should remain upright."
      seed: 43
      steps: 5
      gender: "female"
      location: "Tagesschau"
    - prompt: "The person in image 1 should wear exactly the football jersey shown in image 2. Transfer the jersey from image 2 onto the person in image 1, preserving all details of the jersey including colors, patterns, logos, badges and fabric texture exactly as they appear in image 2. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The person should remain upright."
      seed: 43
      steps: 5
      gender: "male"
      location: "Sport"
    - prompt: "The person in image 1 should wear exactly the football jersey shown in image 2. Transfer the jersey from image 2 onto the person in image 1, preserving all details of the jersey including colors, patterns, logos, badges and fabric texture exactly as they appear in image 2. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The person should remain upright."
      seed: 43
      steps: 5
      gender: "female"
      location: "Sport"
    - prompt: "Change only the persons clothing to a navy blue suit with long arms (jacket and trousers) with a crisp white dress shirt and a solid dark tie. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The Person should remain upright."
      seed: 43
      steps: 5
      gender: "male"
      location: "Arena"
    - prompt: "Change only the persons clothing to a navy blue suit with long arms (jacket and trousers) with a crisp white dress shirt and a solid dark tie. Do not modify the face in any way — preserve every detail exactly as it appears in the original image, including facial structure, skin texture, skin tone, expression, eyes, nose, mouth, and any natural imperfections. The face must look identical to the original. Do not alter the background in any way. Only the clothing changes — nothing else. The Person should remain upright."
      seed: 43
