spring:
  application:
    name: ai-selfies

settings:
  max-name-length: 20

s3:
  url: "https://www.srf.ch/staticfiles/berufsmesse/ki-pics/"
  bucket: "srf-staticfiles-production"
  user-path: "berufsmesse/ki-pics/"
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}

ai-config:
