name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Sonar
        run: ./gradlew sonar --daemon
        env:
          SONAR_TOKEN: ${{ secrets.EDU_SONAR_TOKEN }}

      - name: Upload all HTML reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: target/html-reports/